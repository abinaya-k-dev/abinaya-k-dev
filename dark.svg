<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="610" viewBox="0 0 1180 610">
<defs>
  <linearGradient id="asciiGrad" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#38BDF8">
      <animate attributeName="stop-color" values="#38BDF8;#D946EF;#FB7185;#38BDF8" dur="9s" repeatCount="indefinite"/>
    </stop>
    <stop offset="100%" stop-color="#D946EF">
      <animate attributeName="stop-color" values="#D946EF;#FB7185;#38BDF8;#D946EF" dur="9s" repeatCount="indefinite"/>
    </stop>
  </linearGradient>
  <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#38BDF8"/>
    <stop offset="50%" stop-color="#D946EF"/>
    <stop offset="100%" stop-color="#FBBF24"/>
  </linearGradient>
  <radialGradient id="bgGlow" cx="30%" cy="20%" r="80%">
    <stop offset="0%" stop-color="#1F1B2E"/>
    <stop offset="100%" stop-color="#0B0A14"/>
  </radialGradient>
  <linearGradient id="scanGrad" x1="0%" y1="0%" x2="0%" y2="100%">
    <stop offset="0%" stop-color="#38BDF8" stop-opacity="0"/>
    <stop offset="45%" stop-color="#38BDF8" stop-opacity="0.07"/>
    <stop offset="50%" stop-color="#38BDF8" stop-opacity="0.5"/>
    <stop offset="55%" stop-color="#D946EF" stop-opacity="0.07"/>
    <stop offset="100%" stop-color="#D946EF" stop-opacity="0"/>
  </linearGradient>
  <pattern id="scanlines" width="4" height="4" patternUnits="userSpaceOnUse">
    <rect width="4" height="1" fill="#38BDF8" opacity="0.035"/>
  </pattern>
  <style>
    .ascii  { font-family: 'Courier New', Consolas, monospace; font-size: 7.4px; fill: url(#asciiGrad); letter-spacing: -0.2px; }
    .key    { font-family: 'Courier New', Consolas, monospace; font-size: 15px; fill: #38BDF8; font-weight: bold; }
    .value  { font-family: 'Courier New', Consolas, monospace; font-size: 15px; fill: #E8E4F5; }
    .cc     { font-family: 'Courier New', Consolas, monospace; font-size: 15px; fill: #6B7280; }
    .head   { font-family: 'Courier New', Consolas, monospace; font-size: 17px; fill: #D946EF; font-weight: bold; }
    .accent { font-family: 'Courier New', Consolas, monospace; font-size: 15px; fill: #4ADE80; font-weight: bold; }
    .term-label { font-family: 'Courier New', Consolas, monospace; font-size: 12px; fill: #A5A3C4; letter-spacing: 0.5px; }
    .scan-label { font-family: 'Courier New', Consolas, monospace; font-size: 10px; fill: #F87171; letter-spacing: 1px; }
    .panel-title { font-family: 'Courier New', Consolas, monospace; font-size: 11px; fill: #38BDF8; letter-spacing: 2px; opacity: 0.8; }
    .big { font-family: 'Courier New', Consolas, monospace; font-size: 96px; font-weight: bold; fill: url(#asciiGrad); }
    .cap { font-family: 'Courier New', Consolas, monospace; font-size: 13px; fill: #A5A3C4; letter-spacing: 2px; }
  </style>
</defs>

<rect width="1180" height="610" rx="18" fill="url(#bgGlow)"/>
<rect width="1180" height="610" rx="18" fill="url(#scanlines)"/>

<g id="titlebar">
  <rect x="3" y="3" width="1174" height="34" rx="16" fill="#151226" fill-opacity="0.95" stroke="#2B2642" stroke-width="1"/>
  <circle cx="24" cy="20" r="5" fill="#F87171"><animate attributeName="opacity" values="1;0.55;1" dur="4s" repeatCount="indefinite"/></circle>
  <circle cx="42" cy="20" r="5" fill="#FBBF24"><animate attributeName="opacity" values="1;0.55;1" dur="4s" begin="0.3s" repeatCount="indefinite"/></circle>
  <circle cx="60" cy="20" r="5" fill="#34D399"><animate attributeName="opacity" values="1;0.55;1" dur="4s" begin="0.6s" repeatCount="indefinite"/></circle>
  <text x="590" y="25" text-anchor="middle" class="term-label">abinaya@devos ~ % ./portfolio.sh --live</text>
  <circle cx="1122" cy="20" r="4" fill="#EF4444">
    <animate attributeName="opacity" values="1;0.15;1" dur="1.1s" repeatCount="indefinite"/>
  </circle>
  <text x="1132" y="24" class="scan-label">SCANNING</text>
</g>

<g transform="translate(0,38)">
  <rect x="14" y="26" width="488" height="468" rx="14" fill="#151226" fill-opacity="0.7" stroke="url(#borderGrad)" stroke-width="1" opacity="0.4"/>
  <rect x="508" y="10" width="655" height="500" rx="14" fill="#151226" fill-opacity="0.7" stroke="url(#borderGrad)" stroke-width="1" opacity="0.4"/>
  <text x="30" y="24" class="panel-title">VISUAL.MAP</text>
  <text x="524" y="24" class="panel-title">SYSTEM.INFO</text>

  <g opacity="0"><animate attributeName="opacity" from="0" to="1" dur="0.6s" begin="0.4s" fill="freeze"/>
    <circle cx="120" cy="120" r="88" fill="none" stroke="url(#borderGrad)" stroke-width="2" opacity="0.55"/>
    <circle cx="120" cy="120" r="70" fill="none" stroke="url(#asciiGrad)" stroke-width="1.4" opacity="0.7"/>
    <circle cx="120" cy="120" r="52" fill="url(#asciiGrad)" opacity="0.10"/>
    <text x="120" y="152" text-anchor="middle" class="big">AK</text>
    <circle cx="176" cy="76" r="3" fill="#FBBF24"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.4s" repeatCount="indefinite"/></circle>
    <circle cx="64" cy="170" r="3" fill="#38BDF8"><animate attributeName="opacity" values="0.2;1;0.2" dur="1.8s" repeatCount="indefinite"/></circle>
    <text x="120" y="260" text-anchor="middle" class="cap">ABINAYA&#160;K &#160;//&#160; PORTFOLIO</text>
  </g>
</g>

<g transform="translate(0,38)">
  <line x1="520" y1="40" x2="1166" y2="40" stroke="url(#scanGrad)" stroke-width="40" opacity="0.5">
    <animate attributeName="y1" values="40;480" dur="7s" repeatCount="indefinite"/>
    <animate attributeName="y2" values="80;520" dur="7s" repeatCount="indefinite"/>
  </line>
  <g font-family="'Courier New', Consolas, monospace" font-size="15px" opacity="0" transform="translate(0,0)">
    <animate attributeName="opacity" from="0" to="1" dur="0.35s" begin="0.9s" fill="freeze"/>
    <text x="540" y="114" class="cc">$</text> <text x="560" y="114" class="key">whoami</text>
    <text x="540" y="144" class="value">abinaya_k — mathematics graduate, self-taught builder</text>
  </g>
  <g font-family="'Courier New', Consolas, monospace" font-size="15px" opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.35s" begin="1.25s" fill="freeze"/>
    <text x="540" y="180" class="cc">$</text> <text x="560" y="180" class="key">role</text>
    <text x="540" y="210" class="value">aspiring-ai-engineer</text>
  </g>
  <g font-family="'Courier New', Consolas, monospace" font-size="15px" opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.35s" begin="1.6s" fill="freeze"/>
    <text x="540" y="246" class="cc">$</text> <text x="560" y="246" class="key">languages</text>
    <text x="540" y="276" class="value">python · html · css · javascript</text>
  </g>
  <g font-family="'Courier New', Consolas, monospace" font-size="15px" opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.35s" begin="1.95s" fill="freeze"/>
    <text x="540" y="312" class="cc">$</text> <text x="560" y="312" class="key">learning</text>
    <text x="540" y="342" class="value">ml-fundamentals · apis · git</text>
  </g>
  <g font-family="'Courier New', Consolas, monospace" font-size="15px" opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.35s" begin="2.3s" fill="freeze"/>
    <text x="540" y="378" class="cc">$</text> <text x="560" y="378" class="key">building</text>
    <text x="540" y="408" class="accent">spendmate — sms &amp; upi expense tracker</text>
  </g>
  <g font-family="'Courier New', Consolas, monospace" font-size="15px" opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.35s" begin="2.65s" fill="freeze"/>
    <text x="540" y="444" class="cc">$</text> <text x="560" y="444" class="key">location</text>
    <text x="540" y="474" class="value">madurai · tamil nadu · india</text>
  </g>
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.35s" begin="3.0s" fill="freeze"/>
    <rect x="540" y="446" width="9" height="16" fill="#0EA5E9"><animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/></rect>
  </g>
</g>
</svg>